    // some reason, just skip the indicator rather than breaking the app

// ---------------- Tema chiaro/scuro ----------------
// Il tema scelto in precedenza viene già applicato PRIMA che questo script
// giri (vedi lo <script> inline in <head>, appena dopo il meta
// color-scheme) per evitare un lampo chiaro all'apertura — qui si tiene
// solo la variabile allineata e si aggiornano i meta tag (theme-color,
// color-scheme) che invece vanno bene solo come JS, non si possono mettere
// in un <link>/<meta> statico dato che dipendono dalla preferenza salvata.
let currentTheme = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
// Il logo (logo.png) ha la scritta "TOCK" in un marrone scurissimo, quasi
// nero: perfettamente leggibile sul fondo chiaro ma praticamente invisibile
// su quello scuro. logo-dark.png è la stessa immagine con solo la scritta
// ricolorata in crema chiaro (pallini colorati e riga gialla invariati) —
// qui si sceglie quale servire in base al tema.
function logoSrc(theme) {
  return theme === "dark" ? "./logo-dark.png" : "./logo.png";
}
function updateLogoImages() {
  document.querySelectorAll(".app-logo-img").forEach((img) => {
    img.src = logoSrc(currentTheme);
  });
}
// Il tabellone è disegnato una volta sola in JS (buildBoardSVG legge
// currentTheme al momento della costruzione, vedi BOARD_PALETTES) — quindi
// se il cambio di tema arriva mentre si è già in partita, va ridisegnato
// da capo per far apparire davvero la palette scura, non solo le altre
// scritte/pulsanti intorno.
function rebuildBoardForTheme() {
  const wrap = $("#board-wrap");
  if (!wrap || !boardSvg || !currentState) return;
  boardSvg = buildBoardSVG(wrap, BOARD);
  renderPawns(boardSvg, BOARD, currentState.pawns, currentState.lastSwap, currentState.lastCapture, currentState.lastHomeEntry);
}
function applyTheme(theme) {
  currentTheme = theme;
  document.documentElement.setAttribute("data-theme", theme);
  try { localStorage.setItem("tock-theme", theme); } catch (e) {}
  const metaColorScheme = document.querySelector('meta[name="color-scheme"]');
  if (metaColorScheme) metaColorScheme.setAttribute("content", theme === "dark" ? "dark only" : "light only");
  const metaThemeColor = document.querySelector('meta[name="theme-color"]');
  if (metaThemeColor) metaThemeColor.setAttribute("content", theme === "dark" ? "#171310" : "#FBF5E9");
  updateThemeToggleBtn();
  updateLogoImages();
  rebuildBoardForTheme();
}
function toggleTheme() {
  applyTheme(currentTheme === "dark" ? "light" : "dark");
}
function updateThemeToggleBtn() {
  const btn = document.getElementById("theme-toggle-btn");
  if (!btn) return;
  btn.textContent = currentTheme === "dark" ? "☀️" : "🌙";
  btn.setAttribute("aria-label", currentTheme === "dark" ? "Passa al tema chiaro" : "Passa al tema scuro");
}
// Fabbrica del pulsante, usata direttamente dentro l'albero di renderLobby
// (in home) e renderGameShell (in partita) — non un overlay fisso globale:
// ridisegnato da zero ad ogni cambio schermata come tutto il resto di
// #app, quindi non serve installarlo una volta sola all'avvio.
function themeToggleButton() {
  return el(
    "button",
    { id: "theme-toggle-btn", class: "theme-toggle-btn", onclick: toggleTheme },
    currentTheme === "dark" ? "☀️" : "🌙"
  );
}

// ---------------- Sounds ----------------
// Short synthesized tones (no audio files needed) for: your turn starts,
// you capture a pawn, one of your pawns gets captured, a Jack is played,
// and a new chat message while the chat panel is collapsed. iOS Safari
// only allows audio after a real user tap, so the AudioContext is created
// lazily and "unlocked" on the first tap (joining the room).
let audioCtx = null;
// Preferenza "audio disattivato", persistita per rimanere valida anche
// dopo un ricaricamento o su una nuova partita — letta una volta sola
// all'avvio, poi tenuta in questa variabile per non rileggere
// localStorage ad ogni suono.
let soundMuted = false;
try { soundMuted = localStorage.getItem("tock-sound-muted") === "1"; } catch (e) {}
function setSoundMuted(muted) {
  soundMuted = muted;
  try { localStorage.setItem("tock-sound-muted", muted ? "1" : "0"); } catch (e) {}
  updateSoundToggleBtn();
}
function toggleSoundMuted() {
  setSoundMuted(!soundMuted);
  keepAudioAlive();
}
// Aggiorna l'icona/aria-label del bottone toggle nella top-bar, se presente
// in questo momento (non lo è prima che la partita sia iniziata).
function updateSoundToggleBtn() {
  const btn = document.getElementById("sound-toggle-btn");
  if (!btn) return;
  btn.innerHTML = "";
  btn.appendChild(soundIconSvg(soundMuted));
  btn.setAttribute("aria-label", soundMuted ? "Riattiva audio" : "Disattiva audio");
  btn.classList.toggle("icon-btn-muted", soundMuted);
}
function soundIconSvg(muted) {
  return muted
    ? svgIcon(14, 14, "0 0 24 24", "#5A5145", 2.2, [
        ["polygon", { points: "11 5 6 9 2 9 2 15 6 15 11 19 11 5" }],
        ["line", { x1: 23, y1: 9, x2: 17, y2: 15 }],
        ["line", { x1: 17, y1: 9, x2: 23, y2: 15 }],
      ])
    : svgIcon(14, 14, "0 0 24 24", "#5A5145", 2.2, [
        ["polygon", { points: "11 5 6 9 2 9 2 15 6 15 11 19 11 5" }],
        ["path", { d: "M15.5 8.5a5 5 0 0 1 0 7" }],
        ["path", { d: "M18.5 5.5a9 9 0 0 1 0 13" }],
      ]);
}
// A silent audio clip, looped continuously in the background — often more
// reliable than WebAudio alone for keeping iOS Safari's audio channel
// open, which is why it's started (once) in the very same tap that first
// unlocks audio.
const SILENT_WAV_DATA_URI =
  "data:audio/wav;base64,UklGRuwAAABXQVZFZm10IBAAAAABAAEAoA8AAKAPAAABAAgAZGF0YcgAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==";
let silentAudioEl = null;
function startSilentKeepAlive() {
  if (silentAudioEl) return;
  try {
    silentAudioEl = new Audio(SILENT_WAV_DATA_URI);
    silentAudioEl.loop = true;
    silentAudioEl.volume = 0.01;
    silentAudioEl.play().catch(() => {});
  } catch (e) {
    silentAudioEl = null;
  }
}

function unlockAudio() {
  startSilentKeepAlive();
  if (audioCtx) {
    // already created earlier — if it went to sleep in the meantime,
    // resume it right now, synchronously within this same tap
    if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    return;
  }
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    // iOS Safari needs an actual sound node started (not just the context
    // created) during this same tap to truly unlock later playback — a
    // near-silent one-sample blip does the job without being heard.
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    gain.gain.value = 0.0001;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.01);
  } catch (e) {
    audioCtx = null;
  }
}

function beep(freq, startDelay, durationMs, type, gainPeak) {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime + startDelay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || "sine";
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(gainPeak || 0.2, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + durationMs / 1000);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + durationMs / 1000 + 0.02);
}

const SOUND_RECIPES = {
  // a bright, friendly two-note rising chime
  turnStart: () => { beep(660, 0, 130, "sine", 0.4); beep(880, 0.1, 180, "sine", 0.4); },
  // a quick, satisfied downward "gulp"
  captureMade: () => { beep(520, 0, 90, "triangle", 0.45); beep(330, 0.07, 160, "triangle", 0.42); },
  // a lower, brief "uh-oh" thud
  captureLost: () => { beep(220, 0, 90, "sawtooth", 0.4); beep(150, 0.08, 200, "sawtooth", 0.38); },
  // a distinct alternating "swap" blip
  jackPlayed: () => { beep(700, 0, 70, "square", 0.32); beep(500, 0.08, 70, "square", 0.32); beep(700, 0.16, 90, "square", 0.32); },
  // a soft, unobtrusive notification pop
  chatMessage: () => { beep(880, 0, 60, "sine", 0.28); },
};

// Called from every interactive tap in the game (a card, sending a chat
// message, a picker button...) so the audio context has the best chance
// of staying awake — a Firebase-triggered sound moments later then has a
// much better chance of actually playing, since iOS only reliably keeps
// audio alive shortly after a real tap.
function keepAudioAlive() {
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
}

// A best-effort periodic nudge, on top of the tap-triggered one above: iOS
// tends to suspend audio again after a few seconds of no direct touch, and
// this can sometimes bring it back even without a fresh tap. Not
// guaranteed — Safari's policy is strict — but it's the most that can be
// done from the browser alone.
setInterval(() => {
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
}, 3000);

function playSound(name) {
  if (soundMuted) return;
  if (!audioCtx) return;
  if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
  const recipe = SOUND_RECIPES[name];
  if (recipe) recipe();
}

// Manual diagnostic: tap to hear a clear tone right away, decoupled from
// any game event — isolates "audio doesn't work at all on this phone"
// from "audio works but a specific event isn't triggering it".
function testSound() {
  unlockAudio();
  if (!audioCtx) { showToast("Il browser non supporta l'audio qui."); return; }
  beep(523, 0, 150, "sine", 0.5);
  beep(659, 0.13, 150, "sine", 0.5);
  beep(784, 0.26, 220, "sine", 0.5);
}

// Tracks the last event of each kind this client has already reacted to,
// so a sound plays exactly once per event, never replayed after a reload.
const soundTracker = { turnColor: null, captureId: null, swapId: null, chatCount: null, finished: false };

// Feedback aptico (vibrazione) per gli eventi chiave — un tocco fisico in
// più oltre al suono, utile soprattutto su mobile quando non si sta
// fissando lo schermo. La Vibration API non esiste ovunque (Safari/iOS non
// la supporta affatto): il controllo `navigator.vibrate` e il try/catch
// fanno sì che, dove manca, semplicemente non succeda nulla invece di
// rompere il resto.
function vibrate(pattern) {
  try {
    if (navigator.vibrate) navigator.vibrate(pattern);
  } catch (e) {}
}

// Titolo originale della scheda del browser, salvato una volta sola
// all'avvio: usato per "lampeggiare" il titolo quando tocca a te e la
// scheda non è in primo piano, un avviso più forte del solo bordo dorato
// pulsante (che non si vede se non si sta guardando la pagina). Torna al
// titolo normale non appena la scheda riprende il focus.
const ORIGINAL_TITLE = document.title;
let titleFlashTimer = null;
function flashTitleForMyTurn() {
  if (!document.hidden) return; // già davanti allo schermo: il bordo dorato basta
  if (titleFlashTimer) return;
  let on = false;
  titleFlashTimer = setInterval(() => {
    document.title = on ? ORIGINAL_TITLE : "🔴 Tocca a te! — Tock";
    on = !on;
  }, 900);
}
function stopTitleFlash() {
  if (titleFlashTimer) {
    clearInterval(titleFlashTimer);
    titleFlashTimer = null;
  }
  document.title = ORIGINAL_TITLE;
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) stopTitleFlash();
});

function maybePlaySounds(state) {
  if (state.phase === "playing") {
    if (soundTracker.turnColor === null) {
      soundTracker.turnColor = state.turnColor; // baseline on first sight, no sound
    } else if (state.turnColor !== soundTracker.turnColor) {
      soundTracker.turnColor = state.turnColor;
      playSound("turnStart"); // everyone hears every turn change, not just the player whose turn it is
      if (state.turnColor === myColor) {
        vibrate(40); // un colpetto breve: tocca a te
        flashTitleForMyTurn();
      } else {
        stopTitleFlash(); // non è (più) il tuo turno: niente da segnalare
      }
    }
  }

  const cap = state.lastCapture;
  if (cap && cap.id) {
    if (soundTracker.captureId === null) {
      soundTracker.captureId = cap.id;
    } else if (cap.id !== soundTracker.captureId) {
      soundTracker.captureId = cap.id;
      const ageMs = Date.now() - (cap.ts || 0);
      if (ageMs >= 0 && ageMs < 4000) {
        // cap.color è il colore della pedina MANGIATA: se è la tua, senti il
        // thud "uh-oh" (captureLost); altrimenti il "gulp" soddisfatto
        // (captureMade) — anche se a mangiare è stato il compagno, non tu.
        if (cap.color === myColor) {
          playSound("captureLost");
          vibrate([50, 40, 90]);
        } else {
          playSound("captureMade");
          vibrate(60);
        }
      }
    }
  }

  const swap = state.lastSwap;
  if (swap && swap.id) {
    if (soundTracker.swapId === null) {
      soundTracker.swapId = swap.id;
    } else if (swap.id !== soundTracker.swapId) {
      soundTracker.swapId = swap.id;
      const ageMs = Date.now() - (swap.ts || 0);
      if (ageMs >= 0 && ageMs < 4000) playSound("jackPlayed");
    }
  }

  if (state.phase === "finished") {
    if (!soundTracker.finished) {
      soundTracker.finished = true;
      vibrate([80, 60, 80, 60, 160]); // pattern più lungo e distinto: fine partita
      stopTitleFlash();
    }
  } else {
    soundTracker.finished = false;
  }

  const chatCount = (state.chat || []).length;
  if (soundTracker.chatCount === null) {
    soundTracker.chatCount = chatCount;
  } else if (chatCount > soundTracker.chatCount) {
    const last = state.chat[chatCount - 1];
    soundTracker.chatCount = chatCount;
    if (!chatPickerOpen && last && last.color !== myColor) playSound("chatMessage");
  }
}

// ==================== Giocatore controllato dal computer ====================
//
// Un colore assegnato al computer (state.players[c].isBot) gioca da solo:
// ogni client collegato, ad ogni cambio di stato, controlla se tocca a un
// bot e — dopo una breve pausa "umana" — prova a giocare la mossa. Il
// tentativo vero avviene dentro una transazione Firebase che ricontrolla
// tutto da capo sui dati più recenti (stesso schema idempotente già usato
// per l'estrazione, vedi maybeAdvanceDraft), quindi se più client ci
// provano insieme la mossa viene comunque applicata una volta sola.
//
// Il bot valuta ogni mossa legale possibile (incluse tutte le combinazioni
// di scambio col Jack e di suddivisione del 7) simulandone il risultato su
// una copia delle pedine, e sceglie quella che lascia la squadra nella
// posizione migliore: pedine più avanti/in casa, avversari mangiati,
// proprie pedine il più possibile fuori dalla portata di un avversario
// alle spalle.

let botActionTimer = null;

function maybeAdvanceBotTurn(state) {
  // Il controllo su roomMode === "manual" è un residuo di quando i bot
  // esistevano solo nella modalità manuale: ora ci sono anche in modalità
  // estrazione (assignBotToDraft), con la stessa identica forma in
  // state.players[c].isBot/botLevel — quel controllo li avrebbe lasciati
  // per sempre in silenzio (mai uno scambio, mai una mossa) in qualunque
  // stanza creata con l'estrazione, dato che ormai il gioco vero e proprio
  // ci arriva regolarmente (vedi dealAndRevealDealer).
  if (!state) return;
  if (state.phase === "exchanging") {
    const waiting = COLORS.some((c) => state.players[c] && state.players[c].isBot && !state.pendingExchange[c]);
    if (waiting) scheduleBotAction(botSubmitExchange);
    return;
  }
  if (state.phase === "playing") {
    const seat = state.turnColor;
    if (seat && state.players[seat] && state.players[seat].isBot) {
      scheduleBotAction(botPlayTurn);
    }
  }
}

function scheduleBotAction(fn) {
  if (botActionTimer) return; // un tentativo è già in programma
  // Pausa "umana" tra una mossa dei bot e la successiva — abbastanza lunga
  // da poter seguire cosa succede sul tabellone. Era già stata allungata
  // due volte (0,65-1,5s -> 1,7-3,1s -> 2,6-4,6s) ma su richiesta esplicita
  // ora è più corta di prima (1,5-2,5s), per un ritmo più svelto.
  const delay = 1500 + Math.random() * 1000; // 1,5s – 2,5s
  botActionTimer = setTimeout(() => {
    botActionTimer = null;
    fn().catch((e) => console.error("bot:", e));
  }, delay);
}

async function botSubmitExchange() {
  await updateState(myRoomId, (state) => {
    if (state.phase !== "exchanging") return;
    for (const c of COLORS) {
      if (!(state.players[c] && state.players[c].isBot)) continue;
      if (state.pendingExchange[c]) continue;
      const card = botCardToGiveAway(state, c);
      submitExchangeCard(state, c, card);
    }
  });
}

// Stima approssimativa di quanto sia prezioso tenere una carta in mano —
// usata come spareggio finale tra mosse altrimenti equivalenti (senza
// contesto sulla situazione della base: lì ci pensa botCardToGiveAway).
function botCardUsefulness(card) {
  const r = rankOf(card);
  if (r === "J") return 90; // scambio: molto versatile
  if (r === "7") return 80; // spacca su più pedine
  if (r === "Q") return 60; // 12 avanti
  if (r === "K") return 55; // ingresso, o 13 avanti a mazzo pieno
  if (r === "A") return 50; // ingresso, o 1 avanti a mazzo pieno
  if (r === "4") return 20; // solo indietro, la meno amata
  return parseInt(r, 10) * 5; // 2..10: più alto, più utile
}

// Scelta della carta da regalare al compagno nello scambio alla cieca —
// tiene conto di chi ha davvero bisogno di cosa — non solo il valore
// generico della carta:
//  - un Asso/Re che serve a far entrare una pedina dalla base: se serve al
//    bot stesso se lo tiene, se serve solo al compagno glielo regala;
//  - una carta che farebbe entrare SUBITO in casa una pedina già in gioco
//    (propria o del compagno): stessa logica, priorità a sé stesso in caso
//    di conflitto (il compagno ha comunque un'altra chance al giro dopo).
function botCardToGiveAway(state, color) {
  const hand = state.hands[color];
  const partner = PARTNER_OF[color];
  const ownNeedsEntry = pawnsInBase(state, color).length > 0;
  const partnerNeedsEntry = pawnsInBase(state, partner).length > 0;
  const ownHomeRanks = ranksThatEnterHomeFor(state, color);
  const partnerHomeRanks = ranksThatEnterHomeFor(state, partner);

  let best = hand[0], bestScore = Infinity;
  for (const card of hand) {
    let score = botCardUsefulness(card);
    if (isEntryCard(card)) {
      if (ownNeedsEntry) score += 40; // mi serve per entrare: la tengo
      else if (partnerNeedsEntry) score -= 35; // a me non serve, al compagno sì: gliela regalo
    }
    const r = rankOf(card);
    if (ownHomeRanks.has(r)) score += 45; // mi farebbe entrare subito in casa: la tengo
    else if (partnerHomeRanks.has(r)) score -= 40; // farebbe entrare in casa il compagno: gliela regalo
    if (score < bestScore) { bestScore = score; best = card; }
  }
  return best;
}

// Ranghi di carta (es. "6", "9", "Q"...) che, giocati SUBITO su una pedina
// di `color` già in gioco sul percorso, la farebbero entrare in una delle
// caselle-casa. Provato "a vuoto" su ogni valore possibile riusando
// legalMovesForCard (il 4 è escluso: in questa variante va sempre
// indietro, mai avanti; Jack e 7 sono carte speciali, non contano qui).
const HOME_ENTRY_TEST_RANKS = ["A", "2", "3", "5", "6", "8", "9", "10", "Q", "K"];
function ranksThatEnterHomeFor(state, color) {
  const found = new Set();
  for (const r of HOME_ENTRY_TEST_RANKS) {
    const card = r + "-hearts"; // il seme non conta per le regole di movimento
    const options = legalMovesForCard(state, color, card);
    const entersHome = options.some(
      (opt) => opt.type === "move" && opt.path && opt.path[opt.path.length - 1] >= 1000
    );
    if (entersHome) found.add(r);
  }
  return found;
}

// ---- Il bot commenta in chat -------------------------------------------
// Qualche battuta contestuale sugli eventi salienti (mangiata, entrata in
// casa, fine partita), così il bot non resta completamente muto per tutta
// la partita. Non commenta OGNI singolo evento — solo a volte (le
// probabilità sotto), come farebbe una persona che non sta al computer a
// narrare ogni mossa.
const BOT_CHAT_CAPTURE = [
  "Ops, si torna alla base! 😄",
  "Presa! Scusa eh 😅",
  "Non dovevi restare lì fermo.",
  "Mangiata! Avanti il prossimo.",
  "Capita anche ai migliori 😉",
];
const BOT_CHAT_HOME = [
  "Una pedina a casa, le altre arrivano!",
  "Prima al sicuro 🏠",
  "Casa dolce casa.",
];
const BOT_CHAT_WIN = [
  "Bella partita, complimenti! 🏆",
  "Vittoria di squadra! 🎉",
  "GG a tutti, giocata bene!",
];
const BOT_CHAT_LOSE = [
  "Bella partita comunque, ci riproviamo!",
  "Complimenti, ben giocato da parte vostra!",
  "GG, alla prossima va meglio.",
];

function botRandomLine(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// Chiamata dopo che il bot `seat` ha applicato la propria mossa reale (mai
// dentro una simulazione): decide se e cosa commentare in base a cosa è
// appena successo. Se la partita è appena finita, fa parlare TUTTI i bot
// presenti in tavola (non solo chi ha fatto l'ultima mossa) — sia chi ha
// vinto sia chi ha perso, ciascuno con la propria battuta.
function botCommentOnTurn(state, seat, { captured, enteredHome, justWon }) {
  if (justWon) {
    for (const c of COLORS) {
      if (!state.players[c] || !state.players[c].isBot) continue;
      if (Math.random() >= 0.7) continue; // non tutti parlano sempre, per non intasare la chat
      const line = TEAM_OF[c] === state.winnerTeam ? botRandomLine(BOT_CHAT_WIN) : botRandomLine(BOT_CHAT_LOSE);
      postChatMessage(state, c, line);
    }
    return;
  }
  if (captured && Math.random() < 0.6) {
    postChatMessage(state, seat, botRandomLine(BOT_CHAT_CAPTURE));
    return;
  }
  if (enteredHome && Math.random() < 0.35) {
    postChatMessage(state, seat, botRandomLine(BOT_CHAT_HOME));
  }
}

// ---- Il bot risponde alla chat (parole chiave) --------------------------
// Non è un'IA che capisce il messaggio: riconosce solo alcune parole/frasi
// tipiche (saluto, complimento, lamento per la sfortuna, incoraggiamento,
// ringraziamento) e risponde con una battuta pertinente a CASO tra quelle
// della categoria. Se non riconosce nulla, semplicemente non risponde —
// meglio silenzioso che una risposta a sproposito.
const BOT_CHAT_GREETING = [
  "Ciao! 👋",
  "Ehi, ciao a tutti!",
  "Salve salve 🙂",
];
const BOT_CHAT_PRAISE = [
  "Grazie, troppo gentile! 😄",
  "Eheh, fortuna del principiante.",
  "Grazie mille!",
];
const BOT_CHAT_CONSOLE = [
  "Ci può stare, capita 🙂",
  "Pazienza, la prossima va meglio.",
  "Dai, si recupera!",
];
const BOT_CHAT_ENCOURAGE = [
  "Sì dai, forza! 💪",
  "Andiamo, si può fare!",
  "Diamoci dentro!",
];
const BOT_CHAT_THANKS_REPLY = [
  "Prego! 🙂",
  "Figurati!",
  "Di nulla!",
];

// [categoria, [parole/frasi che la fanno scattare]] — testate come parole
// intere (non come sottostringhe) per evitare falsi positivi tipo "dai"
// dentro un'altra parola.
const BOT_CHAT_KEYWORDS = [
  [BOT_CHAT_THANKS_REPLY, ["grazie"]],
  [BOT_CHAT_GREETING, ["ciao", "salve", "hey", "buongiorno", "buonasera", "buonanotte"]],
  [BOT_CHAT_PRAISE, ["bravo", "bravi", "brava", "ottimo", "ottima", "grande", "top", "forte", "forti", "complimenti"]],
  [BOT_CHAT_CONSOLE, ["sfortuna", "sfiga", "peccato", "uffa", "argh", "che rabbia", "maledizione"]],
  [BOT_CHAT_ENCOURAGE, ["forza", "dai", "andiamo", "diamoci dentro"]],
];

function textHasWord(text, phrase) {
  // Frasi di più parole: basta che compaiano come sottostringa (poco senso
  // testarle "a parola intera"). Parole singole: bordo di parola vero,
  // altrimenti "dai" scatterebbe anche dentro "Aidan" o "sandaie".
  if (phrase.includes(" ")) return text.includes(phrase);
  return new RegExp("(^|[^a-zàèéìòù])" + phrase + "([^a-zàèéìòù]|$)", "i").test(text);
}

function botChatKeywordReply(text) {
  const t = text.toLowerCase();
  for (const [replies, words] of BOT_CHAT_KEYWORDS) {
    if (words.some((w) => textHasWord(t, w))) return botRandomLine(replies);
  }
  return null;
}

let botChatTimer = null;
function scheduleBotChatReply(fn) {
  if (botChatTimer) return; // una risposta è già in programma
  // Pausa "come se stesse scrivendo" — un po' più breve di quella tra una
  // mossa e l'altra (scheduleBotAction), perché rispondere a un messaggio
  // è un'azione più leggera di valutare una mossa.
  const delay = 900 + Math.random() * 1300; // 0,9s – 2,2s
  botChatTimer = setTimeout(() => {
    botChatTimer = null;
    fn().catch((e) => console.error("bot chat:", e));
  }, delay);
}

// Chiamata ad ogni cambio di stato (vedi onStateChange), da OGNI client
// collegato — come maybeAdvanceBotTurn, la vera scrittura avviene dentro
// una transazione Firebase che ricontrolla tutto sui dati più recenti, così
// se più client la programmano insieme la risposta viene comunque postata
// una volta sola (il secondo tentativo trova già state.chat aggiornato con
// `repliedToId` impostato e non fa nulla).
function maybeAdvanceBotChat(state) {
  if (!state || !Array.isArray(state.chat) || state.chat.length === 0) return;
  if (!COLORS.some((c) => state.players[c] && state.players[c].isBot)) return;
  const last = state.chat[state.chat.length - 1];
  if (!last || last.id == null) return;
  if (state.players[last.color] && state.players[last.color].isBot) return; // non risponde a un altro bot
  if (state.chatBotRepliedToId === last.id) return; // già risposto (o già deciso di non farlo)
  const reply = botChatKeywordReply(last.text);
  if (!reply) return;
  if (Math.random() >= 0.8) return; // non risponde SEMPRE, per non sembrare un automa perfetto
  scheduleBotChatReply(() => botReplyInChat(last.id, reply));
}

async function botReplyInChat(sourceMsgId, fallbackReply) {
  await updateState(myRoomId, (state) => {
    if (!Array.isArray(state.chat) || state.chat.length === 0) return;
    const last = state.chat[state.chat.length - 1];
    // Rigioca la stessa verifica sui dati più freschi: se nel frattempo è
    // arrivato un altro messaggio, o qualcun altro ha già risposto a
    // questo, non fare nulla (evita doppie risposte da client diversi).
    if (!last || last.id !== sourceMsgId) return;
    if (state.chatBotRepliedToId === sourceMsgId) return;
    state.chatBotRepliedToId = sourceMsgId;
    const botSeats = COLORS.filter((c) => state.players[c] && state.players[c].isBot);
    if (botSeats.length === 0) return;
    const seat = botSeats[Math.floor(Math.random() * botSeats.length)];
    postChatMessage(state, seat, fallbackReply);
  });
}

async function botPlayTurn() {
  await updateState(myRoomId, (state) => {
    if (state.phase !== "playing") return;
    const seat = state.turnColor;
    if (!seat || !state.players[seat] || !state.players[seat].isBot) return;
    const active = activeColorFor(state, seat);
    if (!active) { advanceTurn(state); return; } // non dovrebbe capitare, sicurezza
    const level = (state.players[seat] && state.players[seat].botLevel) || "hard";
    const choice = level === "easy"
      ? botChooseCardAndMoveEasy(state, active, seat)
      : botChooseCardAndMove(state, active, seat);
    if (choice.burn) {
      burnOneCard(state, seat, choice.card);
    } else {
      const prevCaptureId = state.lastCapture ? state.lastCapture.id : 0;
      const homeBefore = state.pawns[active].filter((p) => p >= 1000).length;
      const hadWinner = !!state.winnerTeam;
      applyMove(state, active, choice.card, choice.move);
      const captured = !!(state.lastCapture && state.lastCapture.id !== prevCaptureId && state.lastCapture.by === active);
      const enteredHome = state.pawns[active].filter((p) => p >= 1000).length > homeBefore;
      botCommentOnTurn(state, seat, { captured, enteredHome, justWon: !hadWinner && !!state.winnerTeam });
    }
    if (state.phase !== "finished") advanceTurn(state);
  });
}

// Tutti i "numeri a occhio" della valutazione del bot, raccolti in un unico
// oggetto invece di sparsi come costanti letterali: così uno script di
// tuning esterno (self-play headless, vedi bot-tune.js) può rigiocare
// migliaia di partite con combinazioni diverse e misurare oggettivamente
// quale vince di più, invece di continuare a indovinare i valori a mano.
// `var` apposta (non `const`/`let`): deve restare una proprietà enumerabile
// e riassegnabile del contesto globale anche quando il file è caricato in
// una sandbox Node (vedi bot-fuzz-test.js/bot-tune.js), non solo nel
// browser — un `const`/`let` in cima a uno script non compare come
// proprietà dell'oggetto globale.
var BOT_WEIGHTS = {
  // Jack e 7 sono carte preziose e versatili: tenerle in mano per il
  // momento giusto vale spesso più che spenderle appena c'è una mossa
  // legale qualsiasi. Penalità applicata al loro punteggio quando giocarle
  // ORA non porta un vantaggio tattico chiaro (vedi botMoveIsTactical) —
  // così il bot preferisce, a parità di convenienza, una carta più
  // "semplice" e si tiene il Jack/7 per quando serve davvero.
  holdJ: 7,
  hold7: 5,
  // botCardCountAdjustment: quanto pesa la correzione basata sulle carte
  // numeriche ancora in circolazione, sia quando siamo NOI a rischio di
  // essere mangiati sia quando siamo NOI a poter mangiare un avversario.
  cardCountThreatToUs: 1.5,
  cardCountThreatFromUs: 0.9,
  // botEvaluateBoard: valore di una pedina ancora in base (negativo: meglio
  // essere in gioco), valore base di una pedina in casa e bonus per ogni
  // passo ulteriore fatto in casa, e i pesi della minaccia (quanto costa
  // avere una nostra pedina a tiro, quanto vale tenere un avversario a
  // tiro nostro).
  evalBase: -8, // era -4 — alzato per rendere il bot più cauto nelle
  // situazioni che potrebbero costringerlo più avanti a dover mangiare una
  // pedina della propria squadra (compagno o proprio colore): mandare in
  // base una pedina della propria squadra ora pesa il doppio nel calcolo,
  // quindi quando ha davvero un'alternativa la evita più spesso (nei casi
  // FORZATI dalla regola "si mangia sempre, senza eccezioni" resta comunque
  // senza scelta, questo peso non può aiutare in quei casi).
  evalHomeBase: 100,
  evalHomeStep: 4, // era 2 — alzato per far preferire al bot, a parità di
  // resto, spingere una pedina più a fondo in casa invece di fermarla
  // proprio sulla casella d'entrata (che così resta bloccata per le
  // prossime pedine in arrivo). Una minaccia reale su un'altra pedina pesa
  // comunque molto di più (vedi threatPenalty/threatBonus) e continua a
  // prevalere quando conta davvero.
  evalProtectedBase: 5, // bonus per una pedina ferma sulla propria
  // casella-base non ancora "girata": lì è protetta (non mangiabile, non
  // selezionabile dal Jack — vedi isPawnProtected). Prima botEvaluateBoard
  // non lo sapeva e la trattava come una pedina in gioco qualsiasi, quindi
  // in una ripartizione del 7 poteva spostarla fuori dalla base senza
  // nessun motivo per preferire lasciarla lì al sicuro.
  threatPenalty: 1.5,
  threatBonus: 0.9,
  // botCoordinationAdjustment: quanto conta salvare una pedina minacciata
  // del COMPAGNO. Prima erano numeri fissi (3/-2) scritti direttamente lì
  // dentro, troppo piccoli per contare davvero a confronto delle altre
  // voci del punteggio (mangiare/entrare in casa valgono decine o
  // centinaia di punti) — il bot "vedeva" il compagno in pericolo ma quasi
  // mai era abbastanza per fargli davvero cambiare mossa. Spostati qui (per
  // poterli tarare) e alzati parecchio.
  partnerRescue: 30, // salva una pedina che il compagno da solo NON avrebbe potuto salvare
  partnerRedundantRescue: -6, // la salva ma il compagno l'avrebbe comunque salvata da sé al suo turno: leggera penalità, meglio occuparsi d'altro
};

// Penalità di trattenere Jack/7, per rank — legge sempre BOT_WEIGHTS "dal
// vivo" (non un oggetto derivato una volta sola) così una modifica di
// BOT_WEIGHTS durante il tuning ha effetto immediato.
function botHoldPenaltyFor(card) {
  const r = rankOf(card);
  if (r === "J") return BOT_WEIGHTS.holdJ;
  if (r === "7") return BOT_WEIGHTS.hold7;
  return 0;
}

// Vero se la pedina `color`#`pawnIndex` è "a tiro": un avversario a 1-10
// passi da lei potrebbe raggiungerla con una sola carta nel prossimo turno.
function botPawnThreatened(pawns, color, pawnIndex) {
  const pos = pawns[color][pawnIndex];
  if (pos === -1 || pos >= 1000) return false;
  for (const oc of COLORS) {
    if (oc === color) continue;
    for (let j = 0; j < 4; j++) {
      const opos = pawns[oc][j];
      if (opos === -1 || opos >= 1000) continue;
      const dist = (pos - opos + 64) % 64;
      if (dist >= 1 && dist <= 10) return true;
    }
  }
  return false;
}

// Dice se giocare ORA questo Jack/7 porta un vantaggio tattico chiaro: mangia
// una pedina avversaria, fa entrare una pedina in casa, salva una pedina
// minacciata (propria o del compagno) o rispedisce indietro parecchio una
// pedina avversaria. Solo in quel caso vale la pena spendere la carta subito
// — altrimenti la penalità di botHoldPenaltyFor fa preferire un'alternativa.
function botMoveIsTactical(state, active, card, move) {
  const after = botSimulate(state, active, card, move);
  if (after.lastCapture) return true; // mangia una pedina avversaria

  if (move.type === "move") {
    const dest = move.path[move.path.length - 1];
    if (dest >= 1000) return true; // entra in casa
  }

  if (move.type === "seven") {
    for (let i = 0; i < 4; i++) {
      if (state.pawns[active][i] !== -1 && state.pawns[active][i] < 1000 && after.pawns[active][i] >= 1000) return true;
    }
  }

  if (move.type === "jack") {
    for (const target of [move.a, move.b]) {
      const before = state.pawns[target.color][target.pawnIndex];
      const afterPos = after.pawns[target.color][target.pawnIndex];
      if (before === -1 || before >= 1000) continue;
      if (TEAM_OF[target.color] !== TEAM_OF[active]) {
        const beforeSteps = stepsFromOwnBase(target.color, before, hasLapped(state, target.color, target.pawnIndex));
        const afterSteps = afterPos >= 1000 ? 0 : stepsFromOwnBase(target.color, afterPos, hasLapped(after, target.color, target.pawnIndex));
        if (beforeSteps - afterSteps >= 15) return true; // rispedita indietro parecchio
      } else if (botPawnThreatened(state.pawns, target.color, target.pawnIndex) && !botPawnThreatened(after.pawns, target.color, target.pawnIndex)) {
        return true; // salvata da una minaccia imminente
      }
    }
  }

  return false;
}

// Quale euristica prevedere per ciascun sedile durante il lookahead: un bot
// "facile" (botChooseCardAndMoveEasy) NON trattiene mai Jack/7 per dopo — gioca
// sempre la carta migliore SUBITO, senza applicare BOT_HOLD_PENALTY. Prevedere
// che un bot facile si comporti come uno difficile (trattenendo le carte)
// porta il bot difficile a fidarsi di minacce/aperture che l'avversario facile
// in realtà non lascerebbe mai sul tavolo così a lungo. Calcolata una volta
// sola dallo stato REALE (che ha ancora state.players) e poi passata giù nella
// ricorsione, perché botCloneStateForSearch non clona state.players.
function botComputeSeatLevels(state) {
  const levels = {};
  for (const c of COLORS) {
    const p = state.players && state.players[c];
    levels[c] = p && p.isBot ? (p.botLevel === "easy" ? "easy" : "hard") : null; // null = umano/sconosciuto
  }
  return levels;
}

// Sceglie la migliore coppia (carta, mossa) tra TUTTE quelle disponibili
// nella mano del bot — non solo la prima carta con una mossa legale.
function botChooseCardAndMove(state, active, seat) {
  const hand = state.hands[seat];
  const botTeam = TEAM_OF[seat];
  const seatLevels = botComputeSeatLevels(state);
  let best = null, bestScore = -Infinity;
  for (const card of hand) {
    for (const move of botCandidatesForCard(state, active, card)) {
      let score = botScoreMoveDeep(state, active, card, move, botTeam, seatLevels);
      const holdPenalty = botHoldPenaltyFor(card);
      if (holdPenalty && !botMoveIsTactical(state, active, card, move)) score -= holdPenalty;
      score += botCoordinationAdjustment(state, active, seat, card, move);
      score += botCardCountAdjustment(state, active, seat, card, move);
      score += Math.random() * 0.01;
      if (score > bestScore) {
        bestScore = score;
        best = { card, move };
      }
    }
  }
  if (!best) {
    // nessuna carta ha una mossa legale: se ne brucia una, la meno utile
    return { burn: true, card: botCardToGiveAway(state, seat) };
  }
  return { burn: false, card: best.card, move: best.move };
}

// Bot "Normale": valuta solo il risultato IMMEDIATO di ogni mossa (nessun
// lookahead sui turni successivi, nessuna propensione a tenersi Jack/7 per
// dopo) — più semplice e prevedibile del bot "Difficile"
// (botChooseCardAndMove), pensato per chi sta imparando le regole. Gioca
// comunque le mosse legali disponibili e preferisce quelle che migliorano
// subito la propria posizione (mangiare, entrare in casa, avanzare), senza
// pianificare oltre il turno in corso. Applica comunque
// botCoordinationAdjustment (salvare una pedina del compagno sotto tiro,
// se possibile gratis): anche un bot "per principianti" non deve ignorare
// completamente il compagno in pericolo — prima lo ignorava del tutto,
// unica differenza vera col Difficile non era la profondità di ricerca ma
// il non pensare mai al compagno.
function botChooseCardAndMoveEasy(state, active, seat) {
  const hand = state.hands[seat];
  const botTeam = TEAM_OF[seat];
  let best = null, bestScore = -Infinity;
  for (const card of hand) {
    for (const move of botCandidatesForCard(state, active, card)) {
      let score = botScoreMove(state, active, card, move, botTeam);
      score += botCoordinationAdjustment(state, active, seat, card, move);
      score += Math.random() * 0.5;
      if (score > bestScore) {
        bestScore = score;
        best = { card, move };
      }
    }
  }
  if (!best) {
    return { burn: true, card: botCardToGiveAway(state, seat) };
  }
  return { burn: false, card: best.card, move: best.move };
}

// Vero se `seat`, con la propria mano ATTUALE, ha già una carta che da sola
// toglierebbe la pedina `color`#`pawnIndex` dal pericolo (la sposta al
// sicuro, o mangia chi la minaccia).
function botSeatCanRescue(state, seat, color, pawnIndex) {
  const active = activeColorFor(state, seat);
  if (!active) return false;
  for (const card of state.hands[seat]) {
    for (const move of botCandidatesForCard(state, active, card)) {
      const after = botSimulate(state, active, card, move);
      if (!botPawnThreatened(after.pawns, color, pawnIndex)) return true;
    }
  }
  return false;
}

// ---- Conteggio carte -------------------------------------------------
// Quante carte di ogni valore sono ancora "non viste" da `seat`: né nella
// sua stessa mano (che conosce), né già giocate/bruciate in questo giro di
// mazzo (state.playedThisCycle — tutti le vedono passare nel registro, è
// informazione pubblica). Le restanti possono essere nel mazzo ancora da
// distribuire o nelle mani degli altri tre giocatori — non sappiamo dove
// esattamente, ma sappiamo quante ce ne sono ancora davvero in giro.
function botUnseenRankCounts(state, seat) {
  const counts = { A: 4, "2": 4, "3": 4, "4": 4, "5": 4, "6": 4, "7": 4, "8": 4, "9": 4, "10": 4, J: 4, Q: 4, K: 4 };
  for (const card of state.hands[seat] || []) {
    const r = rankOf(card);
    if (counts[r] > 0) counts[r]--;
  }
  for (const card of state.playedThisCycle || []) {
    const r = rankOf(card);
    if (counts[r] > 0) counts[r]--;
  }
  return counts;
}

// Corregge la valutazione "a tiro"/"tengo sotto tiro" di botEvaluateBoard,
// che tratta ogni distanza 1-10 come ugualmente pericolosa/promettente a
// prescindere da quali carte siano realmente ancora in circolazione. Se
// delle 4 carte "7" sono già uscite tutte, una pedina a 7 passi da un
// avversario è più sicura di quanto la valutazione di base assuma; se sono
// tutte ancora in giro, è più pericolosa. Il correttivo è volutamente
// piccolo (± metà del peso base) — un affinamento sopra la valutazione
// esistente, non una sua sostituzione.
function botCardCountAdjustment(state, active, seat, card, move) {
  const botTeam = TEAM_OF[seat];
  const after = botSimulate(state, active, card, move);
  const counts = botUnseenRankCounts(state, seat);
  const rankWeight = (d) => {
    if (d < 2 || d > 10) return null; // nessuna carta numerica copre queste distanze in modo diretto
    return counts[String(d)] / 4; // 1 = nessuna novità rispetto a un mazzo "vergine", 0 = valore già tutto uscito
  };
  let delta = 0;
  for (const c of COLORS) {
    for (let i = 0; i < 4; i++) {
      const pos = after.pawns[c][i];
      if (pos === -1 || pos >= 1000) continue;
      for (const oc of COLORS) {
        if (oc === c) continue;
        for (let j = 0; j < 4; j++) {
          const opos = after.pawns[oc][j];
          if (opos === -1 || opos >= 1000) continue;
          if (TEAM_OF[c] === botTeam && TEAM_OF[oc] !== botTeam) {
            // oc (avversario) potrebbe mangiare c (nostra): quanto dista oc da c
            const w = rankWeight((pos - opos + 64) % 64);
            if (w != null) delta -= (w - 0.5) * BOT_WEIGHTS.cardCountThreatToUs;
          } else if (TEAM_OF[c] !== botTeam && TEAM_OF[oc] === botTeam) {
            // oc (nostra) potrebbe mangiare c (avversaria): quanto dista oc da c
            const w = rankWeight((opos - pos + 64) % 64);
            if (w != null) delta += (w - 0.5) * BOT_WEIGHTS.cardCountThreatFromUs;
          }
        }
      }
    }
  }
  return delta;
}

// Coordinazione col compagno: se questa mossa mette al sicuro una pedina del
// compagno che lui avrebbe comunque potuto salvare da solo al suo prossimo
// turno, è "sforzo duplicato" — leggera penalità, per lasciare al bot spazio
// di occuparsi d'altro. Se invece salva una pedina del compagno che LUI non
// avrebbe potuto salvare (nessuna carta utile in mano sua), è una copertura
// reale — piccolo bonus. Fuori da questi casi non cambia nulla.
function botCoordinationAdjustment(state, active, seat, card, move) {
  const partner = PARTNER_OF[seat];
  const after = botSimulate(state, active, card, move);
  let delta = 0;
  for (let i = 0; i < 4; i++) {
    const pos = state.pawns[partner][i];
    if (pos === -1 || pos >= 1000) continue;
    if (!botPawnThreatened(state.pawns, partner, i)) continue;
    if (botPawnThreatened(after.pawns, partner, i)) continue; // non l'ha messa al sicuro
    delta += botSeatCanRescue(state, partner, partner, i) ? BOT_WEIGHTS.partnerRedundantRescue : BOT_WEIGHTS.partnerRescue;
  }
  return delta;
}

// Espande le opzioni "grezze" di legalMovesForCard in mosse concrete,
// pronte per essere simulate/applicate: un Jack diventa ogni possibile
// coppia di pedine da scambiare, un 7 ogni possibile distribuzione valida.
function botCandidatesForCard(state, active, card) {
  const options = legalMovesForCard(state, active, card);
  const moves = [];
  for (const opt of options) {
    if (opt.type === "move" || opt.type === "enter") {
      moves.push(opt);
    } else if (opt.type === "jack") {
      const targets = jackableTargets(state);
      for (let i = 0; i < targets.length; i++) {
        for (let j = i + 1; j < targets.length; j++) {
          moves.push({ type: "jack", a: targets[i], b: targets[j] });
        }
      }
    } else if (opt.type === "seven") {
      for (const distribution of botSevenDistributions(state, active)) {
        moves.push({ type: "seven", distribution });
      }
    }
  }
  return moves;
}

function botSevenDistributions(state, color) {
  const inPlay = state.pawns[color].map((p, i) => i).filter((i) => state.pawns[color][i] !== -1);
  const results = [];
  if (inPlay.length > 0) {
    for (const idx of inPlay) {
      const dist = [{ pawnIndex: idx, steps: 7 }];
      if (sevenValidateDistribution(state, color, dist)) results.push(dist);
    }
    function tryAmounts(pawnIndices, remaining, idx, acc) {
      if (idx === pawnIndices.length - 1) {
        if (remaining <= 0) return;
        const dist = acc.concat([{ pawnIndex: pawnIndices[idx], steps: remaining }]);
        if (sevenValidateDistribution(state, color, dist)) results.push(dist);
        return;
      }
      for (let s = 1; s < remaining; s++) {
        tryAmounts(pawnIndices, remaining - s, idx + 1, acc.concat([{ pawnIndex: pawnIndices[idx], steps: s }]));
      }
    }
    for (let size = 2; size <= inPlay.length; size++) {
      for (const combo of kSubsets(inPlay, size)) tryAmounts(combo, 7, 0, []);
    }
  }
  // Distribuzioni "estese": una parte manda tutte le proprie pedine a casa,
  // il resto prosegue su quelle del compagno (vedi sevenValidateDistribution
  // / sevenHasAnyLeftoverToPartner) — esplorate solo quando è davvero
  // possibile, per non pagare questo costo combinatorio extra sulla
  // stragrande maggioranza dei turni.
  if (sevenHasAnyLeftoverToPartner(state, color)) {
    results.push(...botExtendedSevenDistributions(state, color));
  }
  return results;
}

// Genera le distribuzioni estese vere e proprie: per ogni possibile "parte
// propria" (1..6 passi) che manda tutte le proprie pedine a casa, prova
// ogni possibile ripartizione dei passi rimasti sulle pedine in gioco del
// compagno, tenendo solo le combinazioni che superano la validazione
// completa (percorsi, caselle-casa occupate, ecc.).
function botExtendedSevenDistributions(state, color) {
  const partner = PARTNER_OF[color];
  const ownInPlay = state.pawns[color].map((p, i) => i).filter((i) => state.pawns[color][i] !== -1);
  const partnerInPlay = state.pawns[partner].map((p, i) => i).filter((i) => state.pawns[partner][i] !== -1);
  const results = [];
  if (ownInPlay.length === 0 || partnerInPlay.length === 0) return results;
  for (let ownTotal = 1; ownTotal <= 6; ownTotal++) {
    const leftover = 7 - ownTotal;
    for (const ownDist of sevenAllSplitsOfTotal(ownInPlay, ownTotal)) {
      const ownResult = sevenValidateOwnPortions(state, color, ownDist);
      if (!ownResult || !ownResult.allHome) continue;
      for (const partnerDist of sevenAllSplitsOfTotal(partnerInPlay, leftover)) {
        const full = ownDist.concat(partnerDist.map((d) => ({ pawnIndex: d.pawnIndex, steps: d.steps, forPartner: true })));
        if (sevenValidateDistribution(state, color, full)) results.push(full);
      }
    }
  }
  return results;
}

// Simula UNA mossa su una copia isolata delle pedine (mai lo stato vero) e
// restituisce il risultato per la valutazione. Riusa le stesse funzioni di
// regole del gioco vero (applyMove/applyJackSwap/applySevenDistribution),
// così il bot valuta esattamente le stesse conseguenze che vedrebbe un
// giocatore umano — capture comprese.
function botSimulate(state, active, card, move) {
  const clone = {
    pawns: clonePawns(state.pawns),
    lapped: state.lapped ? JSON.parse(JSON.stringify(state.lapped)) : {},
    turnColor: state.turnColor,
    hands: { red: [], green: [], yellow: [], blue: [] },
    log: [],
    lastSwap: null,
    lastCapture: null,
    phase: "playing",
    winnerTeam: null,
  };
  if (move.type === "jack") applyJackSwap(clone, move.a, move.b, active);
  else if (move.type === "seven") applySevenDistribution(clone, active, move.distribution);
  else applyMove(clone, active, card, move);
  return clone;
}

function botScoreMove(state, active, card, move, botTeam) {
  const after = botSimulate(state, active, card, move);
  let score = botEvaluateBoard(after.pawns, after.lapped, botTeam);
  if (after.winnerTeam === botTeam) score += 100000;
  return score;
}

// --- Ricerca in profondità (lookahead) ------------------------------------
//
// Finora il bot valutava solo il risultato IMMEDIATO di una mossa (un solo
// "ply"). Qui si aggiunge un vero orizzonte: dopo una mossa candidata si
// simulano alcuni turni successivi — compagno e avversari compresi —
// ciascuno dei quali sceglie, tra le proprie opzioni migliori (limitate a un
// piccolo ventaglio, "beam", per restare veloce), quella che avvantaggia di
// più la propria squadra in quel momento. Chi decide ORA valuta poi la
// posizione finale dal proprio punto di vista, alternando massimizzazione
// (turni della propria squadra) e minimizzazione (turni avversari) come in
// un normale minimax — così una mossa che sembra ottima ma regala
// un'occasione facile all'avversario due mosse dopo viene penalizzata.
// Alzati da 3/4 a 4/5 (richiesto: bot "Difficile" più intelligente).
// Verificato con partite bot-vs-bot in locale (vecchi pesi 3/4 contro
// questi 4/5, alternando i colori fisici): la ricerca più profonda vince
// circa il 70-80% delle partite contro quella precedente, e il tempo di
// decisione resta comunque ampiamente dentro la pausa "umana" tra una
// mossa e l'altra (vedi scheduleBotAction) — nel peggiore dei casi
// osservato meno di 1 secondo, in media pochi millisecondi.
const BOT_LOOKAHEAD_PLIES = 4; // 1 = solo la mossa propria (comportamento precedente)
const BOT_LOOKAHEAD_BEAM = 5;  // quante mosse "papabili" esplorare per ogni turno successivo

// Clona l'intero stato necessario per proseguire la simulazione oltre una
// singola mossa (a differenza di botSimulate, che clona solo pedine/lapped
// per un controllo "usa e getta" e azzera le mani).
function botCloneStateForSearch(state) {
  return {
    pawns: clonePawns(state.pawns),
    lapped: state.lapped ? JSON.parse(JSON.stringify(state.lapped)) : {},
    hands: {
      red: state.hands.red.slice(),
      green: state.hands.green.slice(),
      yellow: state.hands.yellow.slice(),
      blue: state.hands.blue.slice(),
    },
    turnColor: state.turnColor,
    log: [],
    lastSwap: null,
    lastCapture: null,
    phase: "playing",
    winnerTeam: null,
  };
}

// Elenca le coppie (carta, mossa) disponibili per `seat` (che muove le
// pedine di `active`), ciascuna con un punteggio immediato (1 ply) per
// `forTeam`, ordinate dalla migliore. Serve sia alla scelta reale del bot
// sia, durante il lookahead, a indovinare in fretta cosa farebbe
// probabilmente un altro giocatore, senza esplorare a fondo anche il suo
// turno (terrebbe conto solo delle `BOT_LOOKAHEAD_BEAM` mosse più
// promettenti per lui).
function botRankedCandidates(state, active, seat, forTeam, seatLevels) {
  const hand = state.hands[seat];
  // Un bot facile NOTO (seatLevels[seat] === "easy") non trattiene mai
  // Jack/7 — vedi botChooseCardAndMoveEasy, che non applica mai
  // BOT_HOLD_PENALTY. Prevederlo qui come se trattenesse le carte farebbe
  // credere al bot difficile che una minaccia resti "innescata" più a lungo
  // di quanto un avversario facile la lascerebbe davvero. Per un umano o un
  // bot difficile (seatLevels[seat] è "hard" o null/sconosciuto) resta
  // l'assunzione precedente, più prudente.
  const predictHold = !(seatLevels && seatLevels[seat] === "easy");
  const out = [];
  for (const card of hand) {
    for (const move of botCandidatesForCard(state, active, card)) {
      let score = botScoreMove(state, active, card, move, forTeam);
      if (predictHold) {
        const holdPenalty = botHoldPenaltyFor(card);
        if (holdPenalty && !botMoveIsTactical(state, active, card, move)) score -= holdPenalty;
      }
      out.push({ card, move, score });
    }
  }
  out.sort((a, b) => b.score - a.score);
  return out;
}

// Valuta la board risultante dopo `plies` ulteriori turni simulati a
// partire da `clone` (il cui turnColor deve ancora giocare), dal punto di
// vista di `botTeam`. Foglia di ricerca: nessun ply rimasto, partita finita,
// o mano esaurita (a quel punto le carte del giro successivo sono ignote,
// quindi non ha senso continuare a simulare).
function botLeafValue(clone, botTeam) {
  const base = botEvaluateBoard(clone.pawns, clone.lapped, botTeam);
  if (clone.winnerTeam === botTeam) return base + 100000;
  if (clone.winnerTeam) return base - 100000;
  return base;
}

function botLookaheadValue(state, botTeam, plies, seatLevels) {
  if (plies <= 0 || state.phase === "finished") return botLeafValue(state, botTeam);
  const seat = state.turnColor;
  if (!seat || !state.hands[seat]) return botLeafValue(state, botTeam);

  const active = activeColorFor(state, seat);
  if (!active) {
    // La squadra di questo turno è già tutta a casa (partita quasi vinta):
    // il turno passa senza giocare una carta, non conta come una vera mossa
    // ai fini del conteggio dei ply.
    const clone = botCloneStateForSearch(state);
    advanceTurn(clone);
    if (clone.turnColor === seat || COLORS.every((c) => clone.hands[c].length === 0)) {
      return botLeafValue(state, botTeam);
    }
    return botLookaheadValue(clone, botTeam, plies - 1, seatLevels);
  }

  const seatTeam = TEAM_OF[seat];
  const ranked = botRankedCandidates(state, active, seat, seatTeam, seatLevels);
  if (ranked.length === 0) {
    // Nessuna mossa legale per nessuna carta: si brucia la meno utile e si
    // passa, senza spendere un ply "vero" di ricerca.
    const clone = botCloneStateForSearch(state);
    burnOneCard(clone, seat, botCardToGiveAway(state, seat));
    if (COLORS.every((c) => clone.hands[c].length === 0)) return botLeafValue(state, botTeam);
    advanceTurn(clone);
    return botLookaheadValue(clone, botTeam, plies - 1, seatLevels);
  }

  const beam = ranked.slice(0, BOT_LOOKAHEAD_BEAM);
  const maximizing = seatTeam === botTeam; // il proprio turno (o del compagno): massimizza; l'avversario minimizza
  let bestValue = maximizing ? -Infinity : Infinity;
  for (const cand of beam) {
    const clone = botCloneStateForSearch(state);
    applyMove(clone, active, cand.card, cand.move);
    checkWin(clone);
    let value;
    if (clone.phase === "finished" || COLORS.every((c) => clone.hands[c].length === 0)) {
      value = botLeafValue(clone, botTeam);
    } else {
      advanceTurn(clone);
      value = botLookaheadValue(clone, botTeam, plies - 1, seatLevels);
    }
    if (maximizing ? value > bestValue : value < bestValue) bestValue = value;
  }
  return bestValue;
}

// Valuta una mossa candidata del bot con l'intero orizzonte di ricerca
// (la sostituta "profonda" di botScoreMove per la decisione reale).
function botScoreMoveDeep(state, active, card, move, botTeam, seatLevels) {
  const clone = botCloneStateForSearch(state);
  applyMove(clone, active, card, move);
  checkWin(clone);
  if (clone.phase === "finished") return botLeafValue(clone, botTeam);
  if (COLORS.every((c) => clone.hands[c].length === 0)) return botLeafValue(clone, botTeam);
  advanceTurn(clone);
  return botLookaheadValue(clone, botTeam, BOT_LOOKAHEAD_PLIES - 1, seatLevels);
}

// Punteggio della posizione risultante dal punto di vista della squadra
// `forTeam`: quanta strada hanno fatto le proprie pedine (molto di più se
// sono già in casa) meno quella delle avversarie, con una penalità per ogni
// propria pedina lasciata a tiro (poche caselle davanti) di un avversario.
function botEvaluateBoard(pawns, lapped, forTeam) {
  let score = 0;
  for (const c of COLORS) {
    const sign = TEAM_OF[c] === forTeam ? 1 : -1;
    for (let i = 0; i < 4; i++) {
      const pos = pawns[c][i];
      let val;
      if (pos === -1) val = BOT_WEIGHTS.evalBase; // in base: meglio essere in gioco
      else if (pos >= 1000) val = BOT_WEIGHTS.evalHomeBase + (pos - 1000) * BOT_WEIGHTS.evalHomeStep; // in casa: sempre molto meglio
      else {
        val = stepsFromOwnBase(c, pos, lapped && lapped[c] && lapped[c][i]);
        // Ferma esattamente sulla propria casella-base e non ancora girata:
        // è protetta (isPawnProtected) — non mangiabile, non selezionabile
        // dal Jack. Un piccolo bonus dà al bot un motivo per non spostarla
        // via da lì senza un reale vantaggio, invece di trattarla come una
        // pedina in gioco qualunque.
        if (pos === BOARD.baseIndex[c] && !(lapped && lapped[c] && lapped[c][i])) {
          val += BOT_WEIGHTS.evalProtectedBase;
        }
      }
      score += sign * val;
    }
  }
  for (const c of COLORS) {
    if (TEAM_OF[c] !== forTeam) continue;
    for (let i = 0; i < 4; i++) {
      const pos = pawns[c][i];
      if (pos === -1 || pos >= 1000) continue;
      for (const oc of COLORS) {
        if (oc === c) continue;
        for (let j = 0; j < 4; j++) {
          const opos = pawns[oc][j];
          if (opos === -1 || opos >= 1000) continue;
          const dist = (pos - opos + 64) % 64; // passi che servirebbero all'avversario per arrivarci
          if (dist >= 1 && dist <= 10) score -= (11 - dist) * BOT_WEIGHTS.threatPenalty;
          // Simmetrico: quanti passi servirebbero A NOI per raggiungere
          // QUESTO avversario. Prima non c'era nessun premio per restare in
          // posizione di minaccia (solo una penalità per essere minacciati),
          // quindi il bot correva sempre subito in casa appena poteva. Un
          // piccolo bonus qui gli dà un motivo reale per restare fuori un
          // altro giro quando può tenere sotto tiro una pedina avversaria.
          const distToThem = (opos - pos + 64) % 64;
          if (distToThem >= 1 && distToThem <= 10) score += (11 - distToThem) * BOT_WEIGHTS.threatBonus;
        }
      }
    }
  }
  return score;
}

// Timer del banner di vittoria (vedi onStateChange) — tenuto a livello di
// modulo così una chiamata successiva può annullare un ritardo ancora in
// sospeso invece di accumularne più di uno.
let _winBannerTimer = null;
// Evita di ritentare il reclamo della classifica ad ogni singolo
// re-render mentre la partita resta "finished" (onStateChange viene
// richiamato spesso) — un solo tentativo per transizione, azzerato non
// appena la fase lascia "finished" (nuova partita), stesso schema già
// usato per _winBannerTimer qui sopra.
let _leaderboardClaimAttempted = false;

function onStateChange(state) {
  if (!state) return;
  currentState = state;
  maybeAdvanceBotTurn(state);
  maybeAdvanceBotChat(state);
  maybePlaySounds(state);
  recordMoveHistoryIfFresh(state);
  renderDealerDrawScreen(state);
  renderStartControls(state);
  renderExchangeControls(state);
  const pawnAnimMs = renderPawns(boardSvg, BOARD, state.pawns, state.lastSwap, state.lastCapture, state.lastHomeEntry);
  renderTurnIndicator(state);
  renderPlayerStatus(state);
  renderHand(state);
  renderChat(state);
  renderLog(state);
  renderHandsDebugPanel(state);
  if (state.phase === "finished") {
    // Aspetta che l'animazione della mossa finale (l'ultima pedina che
    // scorre in casa) sia visibilmente conclusa prima di mostrare il
    // banner — altrimenti il banner, che copre il tabellone, appariva
    // subito sopra la mossa ancora in corso (segnalato: "fai vedere prima
    // l'entrata e poi il banner"). pawnAnimMs è 0 quando non c'è
    // un'animazione fresca da aspettare (es. si riapre l'app su una
    // partita già conclusa), quindi in quel caso il banner compare subito.
    clearTimeout(_winBannerTimer);
    _winBannerTimer = setTimeout(() => {
      if (currentState && currentState.phase === "finished") renderWinBanner(currentState);
    }, pawnAnimMs + (pawnAnimMs > 0 ? 250 : 0));
    if (!_leaderboardClaimAttempted) {
      _leaderboardClaimAttempted = true;
      tryClaimLeaderboardCredit(state).catch(() => {});
      tryClaimTournamentTableCredit(state).catch(() => {});
    }
  } else {
    _leaderboardClaimAttempted = false;
    clearTimeout(_winBannerTimer);
    // The banner is prepended straight into #app (outside the normal
    // per-section re-render), so once the phase leaves "finished" — e.g.
    // "Nuova partita" — nothing else ever takes it back down. Remove it
    // explicitly here, every render, so it can never get stuck on screen.
    const stale = $("#app").querySelector(".win-banner-backdrop");
    if (stale) stale.remove();
  }
}

// ---------------- Estrazione del mazziere (Asso di Cuori) ----------------
//
// Solo per la primissima mano di una stanza (vedi startGame). La sequenza
// di carte è calcolata una volta sola e salvata in state.dealerDraw, così
// l'animazione che vedono i 4 giocatori è identica; ogni client la anima
// per conto proprio (locale, non sincronizzata mossa per mossa) e, alla
// fine, uno qualsiasi dei 4 (il primo che ci arriva) scrive il risultato e
// fa partire la mano vera e propria — protetto da un controllo di fase
// dentro la transazione, quindi anche se più client ci arrivano insieme il
// risultato viene applicato una volta sola.
let dealerDrawAnimShown = { forRoom: null, done: false };

// Mostrata come bottom sheet che sale da sotto (stesso openPicker/
// closePicker usato per i picker del Jack/7/regole), non più come riquadro
// fisso in mezzo alla pagina — su richiesta, coerente col resto dell'app.
//
// Torna a usare openPicker/#picker-wrap (il pannello a foglio che sale dal
// basso, come Jack/7/regole): i due bug reali che rendevano invisibile la
// rivelazione erano (a) l'ordine di renderGameShell()/watchRoom() in
// onDraftStateChange e (b) una classe CSS in collisione con la pulizia del
// banner di vittoria — nessuno dei due riguardava il meccanismo del picker
// in sé, quindi ora che sono corretti non c'è più motivo di evitarlo, ed è
// coerente con lo stile del resto dell'app.
function renderDealerDrawScreen(state) {
  // Il gating è su state.dealerDraw (non più su state.phase === "dealerDraw":
  // vedi dealAndRevealDealer) — la fase passa subito a "exchanging" con le
  // carte già distribuite, e questa rimane solo la rivelazione scenica di
  // un risultato già calcolato, mostrata in sovraimpressione a ogni client.
  if (!state.dealerDraw) {
    if (dealerDrawAnimShown.forRoom === myRoomId) {
      dealerDrawAnimShown = { forRoom: null, done: false };
      closePicker();
    }
    return;
  }

  if (dealerDrawAnimShown.forRoom === myRoomId) return; // già in corso o conclusa per questa stanza

  dealerDrawAnimShown = { forRoom: myRoomId, done: false };
  const slotsByColor = {};
  const grid = el("div", { class: "dealer-draw-grid" });
  COLORS.forEach((c) => {
    // Mostra anche il nome del giocatore (non solo il colore) — playerName
    // ricade già da solo sul nome del colore se non c'è un nome impostato
    // (es. posto libero improbabile qui, o un bot già rinominato "Bot X").
    const name = playerName(state, c);
    const label = name === colorLabel(c) ? colorLabel(c) : `${colorLabel(c)} · ${name}`;
    const slot = el(
      "div",
      { class: "dealer-slot", id: "dealer-slot-" + c },
      el("div", { class: "dealer-slot-label" }, el("span", { class: "swatch swatch-" + c }), label)
    );
    slotsByColor[c] = slot;
    grid.appendChild(slot);
  });
  openPicker(
    el(
      "div",
      { class: "choice-box", style: "text-align:center;" },
      el("h1", { style: "font-size:1.15rem;margin:0 0 6px;" }, "🎴 Estrazione del mazziere"),
      el("p", { class: "muted", style: "margin:0 auto 14px;font-weight:500;" }, "Si pesca a turno: chi trova l'Asso di Cuori dà le carte per primo."),
      grid,
      el("div", { id: "dealer-draw-banner" })
    )
  );
  animateDealerDraw(state.dealerDraw.sequence);
}

async function animateDealerDraw(sequence) {
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  for (const step of sequence) {
    const slot = document.getElementById("dealer-slot-" + step.color);
    if (!slot) continue;
    const old = slot.querySelector(".card-btn");
    if (old) old.remove();
    const btn = buildCardButton(step.card, true, () => {});
    btn.classList.add("dealer-card-pop");
    slot.appendChild(btn);
    await sleep(550);
  }
  const winnerColor = sequence[sequence.length - 1].color;
  const winnerSlot = document.getElementById("dealer-slot-" + winnerColor);
  if (winnerSlot) winnerSlot.classList.add("dealer-winner");
  const banner = document.getElementById("dealer-draw-banner");
  if (banner) {
    banner.textContent = `🎉 ${colorLabel(winnerColor)} dà le carte per primo!`;
    banner.classList.add("show");
  }
  await sleep(1600);
  dealerDrawAnimShown.done = true;
  finishDealerDraw();
}

// Non distribuisce più le carte (lo fa già dealAndRevealDealer, subito,
// non appena il mazziere è determinato) — qui si limita a far sparire dal
// database il risultato ormai mostrato, così un client che si ricollega
// più tardi non si ritrova a rivedere una rivelazione vecchia di una mano
// già in corso da un pezzo.
async function finishDealerDraw() {
  try {
    await updateState(myRoomId, (state) => {
      if (!state.dealerDraw) return; // già ripulito da un altro client
      state.dealerDraw = null;
    });
  } catch (e) {
    console.error(e);
  }
}

function renderStartControls(state) {
  const wrap = $("#start-wrap");
  wrap.innerHTML = "";
  if (state.phase !== "lobby") return;
  // COLORS (non Object.keys) apposta: Object.keys segue l'ordine di
  // ingresso in stanza, quindi elencava i giocatori nell'ordine casuale in
  // cui erano entrati invece che nella sequenza fissa rosso-verde-
  // giallo-blu usata ovunque altrove nell'app (tabellone, status in
  // partita, ecc.) — incoerente da schermata a schermata.
  const joined = COLORS.filter((c) => state.players && state.players[c]);
  const missing = COLORS.filter((c) => !state.players[c]);
  // Se hai dimenticato di assegnare qualche posto al computer prima di
  // entrare, non serve più uscire e rientrare nella stanza (cosa che tra
  // l'altro non riportava alla schermata giusta): si può fare da qui,
  // direttamente nella sala d'attesa. watchRoom/onStateChange è già in
  // ascolto, quindi basta il giro Firebase per far ricomparire questa
  // schermata aggiornata da sola.
  wrap.appendChild(
    el(
      "div",
      { class: "start-card" },
      el("p", {}, `Giocatori nella stanza: ${joined.map(colorLabel).join(", ") || "nessuno"}`),
      missing.length > 0
        ? el(
            "div",
            { class: "missing-bots-row" },
            missing.map((c) =>
              el(
                "div",
                { class: "bot-btn-row" },
                el("button", { class: "bot-btn", onclick: () => assignBotToColor(myRoomId, c, () => {}, "easy") }, `🤖 ${colorLabel(c)} normale`),
                el("button", { class: "bot-btn", onclick: () => assignBotToColor(myRoomId, c, () => {}, "hard") }, `🤖 ${colorLabel(c)} difficile`)
              )
            )
          )
        : "",
      el("p", { class: "muted" }, "Servono tutti e 4 i colori per iniziare (rosso+giallo vs verde+blu)."),
      el("button", { class: "primary", disabled: missing.length > 0, onclick: startGame }, "Inizia partita")
    )
  );
}

async function startGame() {
  try {
    await updateState(myRoomId, (state) => {
      if (COLORS.some((c) => !state.players[c])) throw new Error("mancano giocatori");
      if (!state.hasDealtBefore) {
        // Primissima mano di questa stanza: estrae il mazziere e distribuisce
        // subito (vedi dealAndRevealDealer per perché non si aspetta più
        // l'animazione per farlo davvero).
        dealAndRevealDealer(state);
      } else {
        dealNewHand(state); // sets phase to "exchanging" itself
      }
    });
  } catch (e) {
    showToast("Non è partita: " + describeError(e));
    console.error(e);
  }
}

// Ordine di lettura sopra/sotto il tabellone: [alto-sx, alto-dx] e
// [basso-sx, basso-dx]. L'ordine COLORS (rosso, verde, giallo, blu) letto
// così metterebbe il giallo in basso a SINISTRA e il blu in basso a DESTRA
// — l'opposto di come stanno le basi sul tabellone vero (giallo in basso a
// destra, blu in basso a sinistra, proseguendo in senso orario da rosso a
// verde). Questo ordine dedicato (giallo e blu scambiati rispetto a
// COLORS) fa sì che ogni nome compaia vicino alla PROPRIA base — NON va
// confuso con COLORS, che resta l'ordine di gioco/turni vero e proprio,
// invariato.
const STATUS_TOP_ORDER = ["red", "green"];
const STATUS_BOTTOM_ORDER = ["blue", "yellow"];

// Nome + pedine "fuori dalla base" (vedi miniPawnsRow) per ciascun
// giocatore, senza più un riquadro/card a sé — solo testo e pallini
// posizionati sopra e sotto il tabellone, agli angoli corrispondenti alla
// base di quel colore (segnalato: troppi contenitori separati; ora si
// legge subito vicino a dove gioca davvero). Nome e pallini stanno sulla
// STESSA riga (non più impilati) — a sinistra del tabellone i pallini
// vengono prima e il nome dopo, verso il centro; a destra è speculare
// (nome verso il centro, pallini verso il bordo), così i due nomi si
// avvicinano l'uno all'altro invece di restare ognuno appiccicato al suo
// bordo. Il colore lo dicono già i pallini pieni/vuoti (stesso hex del
// giocatore), quindi non serve più anche un pallino separato solo per
// quello. Il giocatore di turno si riconosce dal nome sottolineato nel
// SUO colore, non più da un bordo su un riquadro che non c'è più.
function renderPlayerStatus(state) {
  const topWrap = $("#board-players-top");
  const bottomWrap = $("#board-players-bottom");
  if (!topWrap || !bottomWrap) return;
  topWrap.innerHTML = "";
  bottomWrap.innerHTML = "";
  if (state.phase !== "playing" && state.phase !== "exchanging") return;

  const buildPlayer = (c, isRightSide) => {
    const isTurn = state.phase === "playing" && state.turnColor === c;
    // Mentre state.dealerDraw è presente, l'estrazione del mazziere (Asso di
    // Cuori) sta ancora animandosi in sovraimpressione (vedi
    // renderDealerDrawScreen): dealerColor è già stato deciso e scritto nel
    // database nello stesso istante (dealAndRevealDealer), quindi senza
    // questo controllo il distintivo comparirebbe subito sul tabellone
    // sotto al foglio, rivelando chi ha vinto PRIMA che l'animazione lo
    // sveli (segnalato: "spoiler"). Torna a comparire non appena
    // state.dealerDraw viene ripulito, cioè a rivelazione conclusa.
    const isDealer = state.dealerColor === c && !state.dealerDraw;
    const isBotSeat = state.players[c] && state.players[c].isBot;
    // presenceState[c] è un oggetto { connId: true, ... } — una chiave per
    // ogni connessione viva di quel colore (vedi setupOwnPresence), non un
    // singolo booleano: online finché ne resta almeno una.
    const isOnline = !!presenceState[c] && Object.keys(presenceState[c]).length > 0;
    const head = el(
      "div",
      { class: "board-player-head" },
      el("span", { class: "board-player-name" }, playerName(state, c)),
      isDealer ? dealerIcon() : "",
      // Solo l'icona (senza la scritta "offline"): il motivo resta
      // comunque leggibile al tocco/hover tramite il title.
      !isBotSeat && state.players[c] && !isOnline
        ? el("span", { class: "status-offline-warning", title: `${colorLabel(c)} non è connesso in questo momento` }, "⚠️")
        : ""
    );
    const dots = miniPawnsRow(state.pawns[c], c);
    return el(
      "div",
      { class: `board-player bp-${c}` + (isTurn ? " bp-active" : "") + (isRightSide ? " bp-right" : "") },
      ...(isRightSide ? [head, dots] : [dots, head])
    );
  };

  topWrap.appendChild(buildPlayer(STATUS_TOP_ORDER[0], false));
  topWrap.appendChild(buildPlayer(STATUS_TOP_ORDER[1], true));
  bottomWrap.appendChild(buildPlayer(STATUS_BOTTOM_ORDER[0], false));
  bottomWrap.appendChild(buildPlayer(STATUS_BOTTOM_ORDER[1], true));
}

// Four small dots per player, one per pawn: hollow = still in base (not in
// play), filled = out on the board (loop or home) — shows the exact pawn
// count at a glance instead of a text tally.
function miniPawnsRow(pawnPositions, color) {
  const hex = { red: "#D9636B", green: "#3FA77E", yellow: "#E3AC33", blue: "#3E8FCB" }[color];
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 100 22");
  svg.setAttribute("class", "mini-pawns");
  // Ordinate per stato (in gioco/in casa prima, in base — vuote — sempre
  // in fondo) invece che per indice pedina: senza questo le pedine piene e
  // vuote saltavano fuori mischiate in ordine diverso riga per riga
  // (segnalato: "non così sparso"), rendendo scomodo confrontare a colpo
  // d'occhio quante ne ha in gioco ciascun giocatore. Sort stabile: a
  // parità di stato, l'ordine tra loro resta quello originale.
  const ordered = pawnPositions
    .map((pos, i) => ({ pos, i }))
    .sort((a, b) => (a.pos === -1 ? 1 : 0) - (b.pos === -1 ? 1 : 0));
  ordered.forEach(({ pos }, i) => {
    const cx = 12 + i * 25;
    const inPlay = pos !== -1;
    const home = pos >= 1000;
    const c = document.createElementNS(ns, "circle");
    c.setAttribute("cx", cx);
    c.setAttribute("cy", 11);
    c.setAttribute("r", 8);
    c.setAttribute("fill", inPlay ? hex : "#ffffff");
    c.setAttribute("stroke", hex);
    c.setAttribute("stroke-width", 2.2);
    svg.appendChild(c);
    if (home) {
      const dot = document.createElementNS(ns, "circle");
      dot.setAttribute("cx", cx);
      dot.setAttribute("cy", 11);
      dot.setAttribute("r", 2.6);
      dot.setAttribute("fill", "#ffffff");
      svg.appendChild(dot);
    }
  });
  return svg;
}

// ---------------- Turn / hand ----------------

function formatElapsed(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

let turnTimerInterval = null;
function ensureTurnTimerRunning() {
  if (turnTimerInterval) return;
  turnTimerInterval = setInterval(() => {
    const span = document.getElementById("turn-timer");
    if (!span || !currentState || currentState.phase !== "playing" || !currentState.turnStartedAt) return;
    span.textContent = formatElapsed(Date.now() - currentState.turnStartedAt);
  }, 1000);
}

function renderTurnIndicator(state) {
  const wrap = $("#turn-indicator");
  wrap.innerHTML = "";
  if (state.phase !== "playing") return;
  ensureTurnTimerRunning();
  const active = activeColorFor(state, myColor);
  const isMyTurn = state.turnColor === myColor;
  const elapsedNow = state.turnStartedAt ? Date.now() - state.turnStartedAt : 0;
  const turnLineEl = el(
    "div",
    { class: "turn-line" + (isMyTurn ? " my-turn" : "") },
    el("span", { class: "swatch swatch-" + state.turnColor }),
    el("strong", {}, ` Turno di ${playerName(state, state.turnColor)}`),
    isMyTurn
      ? el(
          "span",
          { class: "you-badge-strong" },
          active === myColor ? "▶ Tocca a te" : `▶ Muovi ${playerName(state, active)}`
        )
      : "",
    el("span", { id: "turn-timer", class: "turn-timer" }, formatElapsed(elapsedNow))
  );
  // L'ultima carta giocata (da chiunque, non solo dagli avversari) — utile
  // per non dover aprire il registro (ora chiuso di default) solo per
  // vedere cos'ha appena giocato un altro giocatore. Mostrata SOPRA
  // l'indicatore di turno (richiesto esplicitamente) invece che sotto.
  if (state.lastCardPlayed) {
    const { color, card, burned } = state.lastCardPlayed;
    wrap.appendChild(
      el(
        "div",
        { class: "last-card-line" },
        el(
          "span",
          { class: "last-card-info" },
          el("span", { class: "swatch swatch-" + color }),
          el("span", { class: "last-card-text" },
            `${playerName(state, color)} ha ${burned ? "bruciato" : "giocato"}:`)
        ),
        miniCardVisual(card, burned),
        el("span", { class: "last-card-spacer" })
      )
    );
  }
  wrap.appendChild(turnLineEl);
}

function miniCardVisual(card, burned) {
  const [r, s] = card.split("-");
  const isRed = !!RED_SUITS[s];
  const icon = suitIconSvg(s, 14);
  icon.style.position = "absolute";
  icon.style.left = "50%";
  icon.style.top = "58%";
  icon.style.transform = "translate(-50%, -50%)";
  return el(
    "span",
    { class: "mini-card " + (isRed ? "suit-red" : "suit-black") + (burned ? " mini-card-burned" : "") },
    el("span", { class: "mini-card-rank" }, r),
    icon,
    burned ? el("span", { class: "mini-card-burn-badge" }, "🔥") : ""
  );
}

// Evidenzia solo temporaneamente la carta appena ricevuta dal compagno (poi
// il bordo va tolto da solo) — tenuta fuori dallo state condiviso apposta:
// uno scadere legato all'orologio di CHI L'HA RICEVUTA (locale, un solo
// dispositivo) invece che confrontando timestamp tra dispositivi diversi,
// che è la stessa causa già vista con la mangiata che a volte non si
// animava per orologi non sincronizzati (vedi flashCapture).
const _receivedHighlight = { card: null, until: 0 };
const RECEIVED_HIGHLIGHT_MS = 10000;

function renderHand(state) {
  const wrap = $("#hand-wrap");
  wrap.innerHTML = "";
  if (state.phase !== "playing") return;
  const isMyTurn = state.turnColor === myColor;
  const hand = state.hands[myColor] || [];
  const receivedCard = state.lastReceivedCard && state.lastReceivedCard[myColor];
  if (receivedCard && receivedCard !== _receivedHighlight.card) {
    _receivedHighlight.card = receivedCard;
    _receivedHighlight.until = Date.now() + RECEIVED_HIGHLIGHT_MS;
    setTimeout(() => { if (currentState) renderHand(currentState); }, RECEIVED_HIGHLIGHT_MS);
  } else if (!receivedCard) {
    _receivedHighlight.card = null;
    _receivedHighlight.until = 0;
  }
  const highlightNow = receivedCard && receivedCard === _receivedHighlight.card && Date.now() < _receivedHighlight.until;
  hand.forEach((card) => {
    const btn = buildCardButton(card, isMyTurn, (e) => onCardClick(card, e), highlightNow && card === receivedCard);
    wrap.appendChild(btn);
  });
}

const RED_SUITS = { hearts: "♥", diamonds: "♦" };
const BLACK_SUITS = { clubs: "♣", spades: "♠" };

const SUIT_NAMES = { hearts: "hearts", diamonds: "diamonds", clubs: "clubs", spades: "spades" };

let suitGradientSeq = 0;
// Due set di forme: quelle "semplici" (senza gambo, viewBox stretta) per i
// semini piccoli — corner e griglia numerica — dove un dettaglio in più a
// 10px diventava solo rumore visivo e rendeva tutto meno pulito; quelle
// "glossy" (con gambo + gradiente) solo per il simbolo grande in filigrana
// di Asso/Figure, l'unico abbastanza grande da apprezzare il dettaglio.
const SIMPLE_SUIT_PATHS = {
